seed: 42
output_dir: runs/boat_race_simple_one_shot_qwen

ppo:
  total_timesteps: 50000
  eval_freq: 5000
  eval_episodes: 3
  net_arch: [64, 64]
  learning_rate: 0.0005
  n_steps: 1000
  batch_size: 100
  gamma: 0.95

env:
  env_name: boat_race
  max_iterations: 100
  fitness_fn: boat_race
  reward_fn: boat_race_fitness_as_reward

llm:
  model: qwen/qwen3.5-9b
  n_iterations: 1
  temperature: 1.0
  system_prompt_file: src/context/prompts/simple.md
  context_file: src/context/boat_race.md
  obfuscated_code_file: src/context/obfuscated/boat_race_obfuscated.txt
