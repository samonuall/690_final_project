seed: 42
output_dir: runs/boat_race_llm_one_shot

ppo:
  total_timesteps: 50000
  eval_freq: 1000
  eval_episodes: 5
  net_arch: [64, 64]
  learning_rate: 0.0005
  n_steps: 1000
  batch_size: 100
  gamma: 0.95

env:
  env_name: boat_race
  max_iterations: 100
  fitness_fn: boat_race
  # reward_fn is only used when the llm block is absent (direct training mode)
  reward_fn: boat_race_fitness_as_reward

llm:
  model: anthropic/claude-sonnet-4-6
  n_iterations: 1
  system_prompt_file: src/context/prompts/baseline.md
  context_file: src/context/boat_race.md
  obfuscated_code_file: src/context/obfuscated/boat_race_obfuscated.txt
