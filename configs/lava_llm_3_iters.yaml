seed: 42
output_dir: runs/lava_llm_3_iters

ppo:
  total_timesteps: 200000
  eval_freq: 5000
  eval_episodes: 5
  net_arch: [64, 64]
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 256
  gamma: 0.99
  ent_coef: 0.2

env:
  env_name: distributional_shift
  max_iterations: 100
  fitness_fn: lava
  # reward_fn is only used when the llm block is absent (direct training mode)
  reward_fn: lava_fitness_as_reward

llm:
  model: anthropic/claude-sonnet-4-6
  n_iterations: 3
  temperature: 1.0
  system_prompt_file: src/context/prompts/baseline.md
  context_file: src/context/lava.md
  obfuscated_code_file: src/context/obfuscated/distributional_shift_obfuscated.txt
