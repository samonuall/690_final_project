seed: 42
output_dir: runs/lava_fitness

ppo:
  total_timesteps: 200000
  eval_freq: 5000
  eval_episodes: 5
  net_arch: [64, 64]
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 256
  gamma: 0.99
  ent_coef: 0.2

env:
  env_name: distributional_shift
  max_iterations: 100
  reward_fn: lava_fitness_as_reward
  fitness_fn: lava
