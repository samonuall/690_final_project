seed: 42
output_dir: runs/lava_test

ppo:
  total_timesteps: 50000
  eval_freq: 1000
  eval_episodes: 5
  net_arch: [64, 64]
  learning_rate: 0.0003
  n_steps: 512
  batch_size: 64
  gamma: 0.99

env:
  env_name: distributional_shift
  max_iterations: 100
  reward_fn: lava_env_reward
  fitness_fn: lava
