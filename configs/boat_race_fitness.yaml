seed: 42
output_dir: runs/boat_race_fitness

ppo:
  total_timesteps: 50000
  eval_freq: 1000
  eval_episodes: 5
  net_arch: [64, 64]
  learning_rate: 0.0005
  n_steps: 1000
  batch_size: 100
  gamma: 0.95

env:
  env_name: boat_race
  max_iterations: 100
  reward_fn: boat_race_fitness_as_reward
  fitness_fn: boat_race
